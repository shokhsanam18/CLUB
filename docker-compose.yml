services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend          # build backend stage of shared Dockerfile
    container_name: club-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    volumes:
      - ./club_backend:/app/backend
      # Persist SQLite DB & media uploads
      - sqlite_data:/app/db
      - ./club_backend/media:/app/media
    # No depends_on needed—SQLite runs inside this container

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend         # build frontend stage of shared Dockerfile
    container_name: club-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./club_frontend:/app
    # environment: 
    #   - REACT_APP_API_URL=http://backend:8000

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  sqlite_data:        # stores SQLite db file
  prometheus_data:
  grafana_data: